<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ShoeVerse Pro UI</title>

<!-- Google Font -->
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Poppins',sans-serif;background:linear-gradient(135deg,#0f172a,#1e293b);color:#fff}

/* NAVBAR */
nav{display:flex;justify-content:space-between;align-items:center;padding:15px 30px;background:rgba(255,255,255,0.05);backdrop-filter:blur(10px);position:sticky;top:0}
nav h2{font-weight:600}
nav a{color:#fff;margin:0 10px;text-decoration:none;transition:0.3s}
nav a:hover{color:#38bdf8}

.container{padding:30px}

/* HERO */
.hero{text-align:center;padding:50px 20px}
.hero h1{font-size:2.5rem}
.hero p{opacity:0.8}

/* GRID */
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:20px}

/* CARD */
.card{background:rgba(255,255,255,0.08);border-radius:15px;padding:15px;backdrop-filter:blur(10px);transition:0.3s}
.card:hover{transform:translateY(-5px);box-shadow:0 10px 20px rgba(0,0,0,0.3)}
.card img{width:100%;border-radius:10px}
.card h3{margin:10px 0}

/* BUTTON */
.btn{background:#38bdf8;color:#000;padding:8px 12px;border:none;border-radius:8px;cursor:pointer;font-weight:600}
.btn:hover{background:#0ea5e9}

/* FORM */
form{background:rgba(255,255,255,0.08);padding:20px;border-radius:15px;backdrop-filter:blur(10px);max-width:400px}
input{width:100%;padding:10px;margin:8px 0;border:none;border-radius:8px}

/* PROFILE */
.profile{display:none;margin-top:20px;background:rgba(255,255,255,0.08);padding:20px;border-radius:15px}

/* VIDEO */
iframe{border-radius:15px}

</style>
</head>

<body>

<nav>
<h2>👟 ShoeVerse</h2>
<div>
<a href="#home">Home</a>
<a href="#products">Products</a>
<a href="#video">Video</a>
<a href="#login">Login</a>
</div>
</nav>

<div class="container">

<!-- HERO -->
<section class="hero" id="home">
<h1>Modern Shoe Marketing 🚀</h1>
<p>All Digital Marketing Channels in One Platform</p>
</section>

<!-- PRODUCTS -->
<section id="products">
<h2>🔥 Trending Shoes</h2>
<div class="grid" id="productGrid"></div>
</section>

<!-- VIDEO -->
<section id="video">
<h2>🎥 Video Marketing</h2>
<iframe width="100%" height="300" src="https://www.youtube.com/embed/2Vv-BfVoq4g"></iframe>
</section>

<!-- LOGIN -->
<section id="login">
<h2>🔐 Login</h2>
<form onsubmit="return saveUser()">
<input type="text" id="username" placeholder="Username">
<input type="password" id="password" placeholder="Password">
<button class="btn">Login</button>
</form>
<p id="loginMsg"></p>

<div class="profile" id="profile">
<p id="userDisplay"></p>
<button class="btn" onclick="logout()">Logout</button>
</div>
</section>

</div>

<script>

const products = [
{ name:"Running Shoes", img:"https://images.unsplash.com/photo-1528701800489-20be3c7f5a3b"},
{ name:"Casual Shoes", img:"https://images.unsplash.com/photo-1519741497674-611481863552"},
{ name:"Sports Shoes", img:"https://images.unsplash.com/photo-1600185365483-26d7a4cc7519"}
];

function loadProducts(){
let grid = document.getElementById("productGrid");
products.forEach(p=>{
    grid.innerHTML += `
    <div class='card'>
        <img src='${p.img}'>
        <h3>${p.name}</h3>
        <button class='btn' onclick='addToCart("${p.name}")'>Add to Cart</button>
    </div>`;
});
}

function addToCart(item){
let cart = JSON.parse(localStorage.getItem("cart")) || [];
cart.push(item);
localStorage.setItem("cart", JSON.stringify(cart));
alert("Added: " + item);
}

function saveUser(){
let user = document.getElementById("username").value;
let pass = document.getElementById("password").value;

if(user=="" || pass==""){
    document.getElementById("loginMsg").innerText="Fill all fields";
    return false;
}

localStorage.setItem("user", user);
document.getElementById("loginMsg").innerText="Login Success";
showProfile();
return false;
}

function showProfile(){
let user = localStorage.getItem("user");
if(user){
    document.getElementById("profile").style.display="block";
    document.getElementById("userDisplay").innerText="Welcome " + user;
}
}

function logout(){
localStorage.removeItem("user");
location.reload();
}

loadProducts();
showProfile();

</script>

</body>
</html>
